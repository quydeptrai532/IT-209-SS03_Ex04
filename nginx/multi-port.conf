# Bài 4 - Nginx Virtual Hosts chạy song song nhiều cổng
# /etc/nginx/sites-available/multi-port.conf
#
# Cổng 8080 -> Beta App      (/var/www/beta-app/html)
# Cổng 8090 -> Internal App  (/var/www/internal-app/html)

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/beta-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/beta-app.access.log;
    error_log  /var/log/nginx/beta-app.error.log;
}

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /var/www/internal-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/internal-app.access.log;
    error_log  /var/log/nginx/internal-app.error.log;
}
